# Copy to all.yml (gitignored). Host is Debian + Incus (no Proxmox).

# --- app container (podman-capable Incus container an app self-provisions on) ---
# Off by default. Flip true + run `ansible-playbook site.yml --tags app` to create the bare
# container; the app's OWN repo then installs podman + secrets + deploy on top (its
# provision-host.sh). The homelab side carries no app secrets. See docs/gondola.md.
app_enabled: false

# --- FUTURE: camera stack + Home Assistant (not deployed on this box yet) ---
# The camera stack (Frigate/Scrypted/Caddy) will run as an UNPRIVILEGED Incus container with an
# Incus `gpu` device (renderD128), and Home Assistant OS as an Incus KVM VM. Both are opt-in and
# not yet validated on hardware; enabling them also requires installing the full `incus` package
# (VM support / qemu) on the host.
cameras_enabled: false
haos_enabled: false
# HomeKit/Scrypted is a compose profile inside the camera container (empty = Frigate + Caddy only).
compose_profiles: []
# HAOS image to download for the VM (pin a version).
haos_image_url: "https://github.com/home-assistant/operating-system/releases/download/14.0/haos_ova-14.0.qcow2.xz"

# Tailscale auth key: NOT stored here. Read from the same .env (TS_AUTHKEY) so all
# secrets live in one Bitwarden note. Export it before running, or pass -e ts_authkey=...
ts_authkey: "{{ lookup('ansible.builtin.env', 'TS_AUTHKEY') }}"
ts_hostname: pve              # tailnet node name -> `ssh root@pve`

# Host hardening
admin_user: oxyc
admin_github_user: oxyc        # SSH keys auto-pulled from https://github.com/<user>.keys
haos_ip: 192.168.x.x           # HA VM IP (future) — host alerts (smartd) POST to its webhook

# Advertise the home LAN so the phone reaches HA/Frigate/cameras through the host
# (the single "way in"). Set to your real LAN CIDR; approve via tailscale/acl.hujson.
ts_advertise_routes: "192.168.10.0/24"

# host_hardening host firewall — which subnet(s) may reach the host control plane (SSH). Tailscale
# is always allowed regardless. List the TRUSTED management subnets: Punta Ballena = the Main VLAN
# (192.168.10.0/24) so Cameras/IoT/Guest VLANs can never reach the box. During the move, allow BOTH
# the current LAN and the destination Main VLAN, then drop the Montevideo entry after the move.
firewall_mgmt_cidrs:
  - "192.168.10.0/24"   # Punta Ballena Main VLAN (permanent)
  - "192.168.x.x/24"    # TODO(move): current Montevideo LAN — remove after the move
