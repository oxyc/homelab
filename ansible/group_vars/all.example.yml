# Copy to all.yml (gitignored).
# HomeKit/Scrypted is just a compose profile. Empty = Frigate + Caddy only (test first).
# Add 'homekit' and re-run (make deploy) to also bring up Scrypted.
compose_profiles: []
# compose_profiles: [homekit]

# gondola.uy app + self-hosted CI/CD runner in its own isolated LXC. Off by default.
# Flip to true and run `ansible-playbook site.yml --tags gondola`. Secrets come from .env:
#   GONDOLA_GH_PAT         PAT (repo `administration` scope) — mints the runner registration token
#   GONDOLA_TUNNEL_TOKEN   gondola's own Cloudflare tunnel token (from infra/cloudflare)
#   GONDOLA_ANTHROPIC_KEY  Anthropic API key for the nightly ai-audit/enrichment steps
# See docs/gondola.md for the full design + the CI cost fix.
gondola_enabled: false
gondola_gh_pat: "{{ lookup('ansible.builtin.env', 'GONDOLA_GH_PAT') }}"

# HAOS image to download for the VM (pin a version).
haos_image_url: "https://github.com/home-assistant/operating-system/releases/download/14.0/haos_ova-14.0.qcow2.xz"

# Tailscale auth key: NOT stored here. Read from the same .env (TS_AUTHKEY) so all
# secrets live in one Bitwarden note. Export it before running, or pass -e ts_authkey=...
ts_authkey: "{{ lookup('ansible.builtin.env', 'TS_AUTHKEY') }}"
ts_hostname: pve              # tailnet node name -> `ssh root@pve`, https://pve:8006

# Host hardening
admin_user: oxyc
admin_github_user: oxyc        # SSH keys auto-pulled from https://github.com/<user>.keys
haos_ip: 192.168.x.x           # HA VM IP (VLAN10) — host alerts (smartd) POST to its webhook

# Proxmox API (the proxmox/proxmox_kvm modules talk to the local PVE API)
pve_api_host: 127.0.0.1
pve_api_user: root@pam
pve_api_password: "{{ lookup('ansible.builtin.env', 'PVE_PASSWORD') }}"   # root pw, from .env
# Advertise the home LAN so the phone reaches HA/Frigate/cameras through the host
# (the single "way in"). Set to your real LAN CIDR; approve via tailscale/acl.hujson.
ts_advertise_routes: "192.168.10.0/24"
