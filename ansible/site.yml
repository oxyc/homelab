# Top-level playbook. Run phases with tags:
#   ansible-playbook site.yml --tags host        # Debian base + Incus + hardening
#   ansible-playbook site.yml --tags app         # the podman-capable app container(s)
#   ansible-playbook site.yml --tags backup
#   ansible-playbook site.yml --tags ha          # FUTURE (ha_enabled): Home Assistant Container + Mosquitto
#   ansible-playbook site.yml --tags cameras     # FUTURE (cameras_enabled): camera stack (podman + Quadlet)
# Always dry-run first on the real box:  --check --diff
#
# The host is plain Debian 13 + Incus (no Proxmox). No PVE API is contacted — guests are managed
# with the `incus` CLI over its local socket, so there are no api_host/api_password module defaults.

- name: Provision homelab (Debian + Incus)
  hosts: pve
  gather_facts: true
  pre_tasks:
    # Before ANY role, because every one of them installs packages. The Proxmox repo outlived
    # Proxmox: pve-no-subscription.sources is still configured and Signed-By a keyring the migration
    # removed, so every `apt-get update` fails signature verification on it — which made the apt
    # module fail after 5 retries and abort the whole play on its very first task. Zero pve-* or
    # proxmox-* packages remain installed, so the repo buys nothing and costs working package
    # management, including the unattended security updates host_hardening enables.
    - name: Remove the Proxmox apt repository (its keyring went with Proxmox; breaks every apt update)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pve-no-subscription.sources
        state: absent
      register: pve_repo_removed
      tags: [always]

    - name: Refresh the apt cache once the broken source is gone
      ansible.builtin.apt:
        update_cache: true
      when: pve_repo_removed.changed
      tags: [always]
  roles:
    - role: incus_host         # Debian base, Incus install + lvm-thin pool + bridged profile, NVR mount, iGPU
      tags: [host]
    - role: host_hardening     # admin user + sudo, SSH key, sshd hardening, nftables lockdown, watchdog, auto-updates
      tags: [host, hardening]
    - role: ups                # OPT-IN (ups_enabled): NUT monitors the local UPS → clean shutdown on low battery.
      tags: [host, ups]        # Config-ready but OFF: enable only AFTER the UPS is physically connected (see role defaults).
      when: ups_enabled | default(false)
    - role: tailscale          # remote SSH from phone over the tailnet
      tags: [tailscale, remote]
    - role: incus_app          # OPT-IN (app_enabled): a bare isolated podman-capable container (its app self-provisions)
      tags: [app]
      when: app_enabled | default(false)
    - role: cloudflare_tunnel  # OPT-IN (tunnel_enabled): the PRIVATE tunnel — everything behind a login (den, HA later)
      tags: [tunnel, remote]   # Runs on the HOST: no podman here, so a binary + systemd unit, not a Quadlet.
      when: tunnel_enabled | default(false)
    - role: ha_container       # FUTURE (ha_enabled): Home Assistant Container + Mosquitto (podman + Quadlet) in an Incus container
      tags: [ha]
      when: ha_enabled | default(false)
    - role: camera_container   # FUTURE (cameras_enabled): camera stack (Frigate/Scrypted/Caddy) as an Incus container w/ gpu (podman + Quadlet)
      tags: [cameras]
      when: cameras_enabled | default(false)
    - role: restic_backup      # restic -> offsite systemd timer (HA backups) — part of the camera/HA stack
      tags: [backup]
      when: cameras_enabled | default(false)
    - role: reolink_cameras    # encoder/NTP config via the Reolink API (run --check first)
      tags: [cameras]
      when: cameras_enabled | default(false)
