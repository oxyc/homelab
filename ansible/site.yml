# Top-level playbook. Run phases with tags:
#   ansible-playbook site.yml --tags host        # Debian base + Incus + hardening
#   ansible-playbook site.yml --tags app         # the podman-capable app container(s)
#   ansible-playbook site.yml --tags backup
#   ansible-playbook site.yml --tags haos        # FUTURE (haos_enabled): HAOS as an Incus VM
#   ansible-playbook site.yml --tags docker      # FUTURE (cameras_enabled): camera stack under Incus
# Always dry-run first on the real box:  --check --diff
#
# The host is plain Debian 13 + Incus (no Proxmox). No PVE API is contacted — guests are managed
# with the `incus` CLI over its local socket, so there are no api_host/api_password module defaults.

- name: Provision homelab (Debian + Incus)
  hosts: pve
  gather_facts: true
  roles:
    - role: incus_host         # Debian base, Incus install + lvm-thin pool + bridged profile, NVR mount, iGPU
      tags: [host]
    - role: host_hardening     # admin user + sudo, SSH key, sshd hardening, nftables lockdown, watchdog, auto-updates
      tags: [host, hardening]
    - role: tailscale          # remote SSH from phone over the tailnet
      tags: [tailscale, remote]
    - role: incus_app          # OPT-IN (app_enabled): a bare isolated podman-capable container (its app self-provisions)
      tags: [app]
      when: app_enabled | default(false)
    - role: haos_vm            # FUTURE (haos_enabled): Home Assistant OS as an Incus KVM VM (pulls the full `incus`+qemu)
      tags: [haos]
      when: haos_enabled | default(false)
    - role: docker_host        # FUTURE (cameras_enabled): camera stack (Frigate/Scrypted/Caddy) as an Incus container w/ gpu
      tags: [docker, cameras]
      when: cameras_enabled | default(false)
    - role: restic_backup      # restic -> offsite systemd timer (HA backups) — part of the camera/HA stack
      tags: [backup]
      when: cameras_enabled | default(false)
    - role: reolink_cameras    # encoder/NTP config via the Reolink API (run --check first)
      tags: [cameras]
      when: cameras_enabled | default(false)
