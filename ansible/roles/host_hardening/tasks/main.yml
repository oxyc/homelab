# Debian host hardening. ORDER MATTERS: provision the admin user + SSH keys BEFORE
# tightening sshd, so you never lock yourself out. (Tailscale SSH is a separate daemon and
# stays available regardless — an extra safety net if sshd is ever misconfigured.)
# (Was "Proxmox host hardening"; the box is now plain Debian + Incus — the PVE-specific tasks
#  that used to live here — rrdcached/pve-firewall/pve-ha/watchdog-mux — are gone with Proxmox.)

- name: Ensure sudo is installed (minimal Debian base can ship without it → visudo missing)
  ansible.builtin.apt:
    name: sudo
    state: present

# De-Proxmox leftover: /etc/cron.d/vzdump is a dangling symlink to /etc/pve/vzdump.cron (the pmxcfs
# cluster FS + vzdump binary are gone with Proxmox). cron re-reads /etc/cron.d every MINUTE and logs
# "CAN'T OPEN SYMLINK" each time → ~1440 journal lines/day + a cron→root mail. Remove the cruft.
- name: Remove the dangling Proxmox vzdump cron symlink
  ansible.builtin.file:
    path: /etc/cron.d/vzdump
    state: absent

# /var/lib/vz was Proxmox's storage dir (CT templates + ISOs) — Incus never touches it. ~1 GB of dead
# install media left by the migration.
- name: Remove the Proxmox /var/lib/vz storage leftover
  ansible.builtin.file:
    path: /var/lib/vz
    state: absent

# postfix ships enabled and listens on :25 purely to deliver LOCAL system mail (cron/unattended-upgrades
# reports). Nobody reads local mail on this box, so it's ~15 MB RSS + an open listener for nothing. Mask
# it. Side effect: mail from cron/etc is discarded (sendmail calls fail quietly) — intended.
- name: Mask postfix (no local mail consumer; frees RSS + closes :25)
  ansible.builtin.systemd:
    name: postfix
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Create admin user (sudo group)
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Passwordless sudo for admin (homelab; the SSH key is the real gate)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: Authorize SSH keys from GitHub for admin and root
  ansible.posix.authorized_key:
    user: "{{ item }}"
    key: "https://github.com/{{ admin_github_user }}.keys"   # module fetches the URL
  loop:
    - "{{ admin_user }}"
    - root

- name: Harden sshd (key-only; root key-only)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
    mode: "0644"
  notify: Restart sshd

- name: Validate the full sshd config (aborts before restart if broken)
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic security updates (no auto-reboot of the host)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# fail2ban intentionally omitted: SSH is not internet-exposed (Tailscale-only, no port-forward),
# so there is no public brute-force surface for it to protect.

# --- stability / self-maintenance ---
- name: Ensure the journald drop-in dir exists (not created by default)
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Cap journald disk usage (logs can't fill the disk)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-size.conf
    content: |
      [Journal]
      SystemMaxUse=500M
    mode: "0644"
  notify: Restart journald

- name: Enable periodic fstrim (SSD/NVMe longevity)
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started

- name: Install smartmontools (disk/NVMe health monitoring)
  ansible.builtin.apt:
    name: smartmontools
    state: present

- name: Disk-failure alert script (smartd -> HA webhook)
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-smartd-alert
    mode: "0755"
    content: |
      #!/bin/sh
      curl -fsS -m10 -X POST "http://{{ ha_ip }}:8123/api/webhook/homelab_alert" \
        -H 'Content-Type: application/json' \
        -d "{\"message\": \"SMART: $SMARTD_MESSAGE ($SMARTD_DEVICE)\"}" || true

- name: Point smartd at the alert script
  ansible.builtin.copy:
    dest: /etc/smartd.conf
    mode: "0644"
    content: |
      # -W DIFF,INFO,CRIT: log a 4C swing, log once at 65C, and ALERT at 72C. The 3060 micro
      # has no room for an NVMe heatsink and idles ~60C, so a temperature alert (not just a
      # SMART-failure alert) is our early warning before the drive thermally throttles.
      DEVICESCAN -a -W 4,65,72 -o on -S on -n standby,q -m root -M exec /usr/local/bin/homelab-smartd-alert
  notify: Restart smartd

# --- external dead-man's switch (optional: only if HEALTHCHECK_URL is set) ---
# The host pings healthchecks.io on a timer; if the box (or its internet) dies, the pings
# stop and healthchecks.io alerts YOU. This is the only monitor that survives the box being
# fully down — every other alert here is sent *by* the box. URL kept in a 0600 file so it's
# never in a world-readable unit (anyone with it could mask an outage by pinging).
- name: Deploy the healthcheck ping URL (0600)
  ansible.builtin.copy:
    dest: /etc/homelab-healthcheck.env
    content: "HEALTHCHECK_URL={{ lookup('ansible.builtin.env', 'HEALTHCHECK_URL') }}\n"
    mode: "0600"
  no_log: true   # the URL is a secret (pinging it can mask an outage)
  when: lookup('ansible.builtin.env', 'HEALTHCHECK_URL') | length > 0

- name: Install the healthcheck ping service + timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: healthcheck-ping.service
      content: |
        [Service]
        Type=oneshot
        EnvironmentFile=/etc/homelab-healthcheck.env
        # --retry 3: ride out a transient blip so one dropped ping doesn't read as "down".
        ExecStart=/usr/bin/curl -fsS -m10 --retry 3 ${HEALTHCHECK_URL}
    - name: healthcheck-ping.timer
      content: |
        [Timer]
        OnBootSec=2min
        # 30min, not 15: this ping is disk-write-free and ~60ms, so it's the cheapest wake on the box —
        # halving it (96 -> 48/day) is idle-tidiness, not power. Detecting a dead box within ~30-45min
        # (ping period + grace) is fine for a home host. NOTE: the hc-ping check's expected period +
        # grace must be widened to match, or a 30min gap reads as "down". RandomizedDelaySec avoids
        # phase-locking to the minute with the other host timers.
        OnUnitActiveSec=30min
        RandomizedDelaySec=120
        [Install]
        WantedBy=timers.target
  when: lookup('ansible.builtin.env', 'HEALTHCHECK_URL') | length > 0

- name: Enable the healthcheck ping timer + send one ping now
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - healthcheck-ping.timer
    - healthcheck-ping.service   # oneshot → fires an immediate ping so the check goes green
  when: lookup('ansible.builtin.env', 'HEALTHCHECK_URL') | length > 0

# --- PCIe stability + hardware-watchdog auto-recovery (from a real 3-week outage) ---
# The boot NVMe (DRAM-less Realtek RTS5765DL) threw a storm of PCIe AER *correctable*
# errors under ASPM power management and hard-hung the host. The dead-man's switch fired,
# but nothing rebooted the box, so it sat dead until a manual restart. Two-part fix:
#   1. Stop the storm at the source: disable PCIe ASPM + NVMe APST power transitions.
#   2. Add a hardware-watchdog that hard-resets the box if it ever hangs again (any cause).
# ESCAPE HATCH if the watchdog ever misfires: at GRUB press `e`, append
# `modprobe.blacklist=iTCO_wdt` to the linux line, Ctrl-X to boot once, then fix the config.

- name: Disable PCIe ASPM + NVMe APST on the kernel cmdline (stops the AER storm)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT="(?![^"]*pcie_aspm=off)[^"]*)"$'
    replace: '\1 pcie_aspm=off nvme_core.default_ps_max_latency_us=0"'
  register: grub_cmdline

- name: Regenerate grub when the cmdline changed (applies on next reboot)
  ansible.builtin.command: update-grub
  when: grub_cmdline is changed
  changed_when: true

- name: Blacklist the software watchdog — we want the real hardware one
  ansible.builtin.copy:
    dest: /etc/modprobe.d/softdog-blacklist.conf
    content: "blacklist softdog\n"
    mode: "0644"

# On plain Debian nothing blacklists iTCO_wdt, but an explicit modprobe-by-name is upgrade-safe
# and unambiguous. A tiny oneshot loads it at boot; systemd arms RuntimeWatchdogSec on the device
# as soon as it appears. (Under Proxmox this also had to bypass PVE's `blacklist iTCO_wdt` +
# watchdog-mux, which grabbed /dev/watchdog for HA — both gone with Proxmox.)
- name: Install the iTCO watchdog auto-load service
  ansible.builtin.copy:
    dest: /etc/systemd/system/hw-watchdog-load.service
    mode: "0644"
    content: |
      [Unit]
      Description=Load iTCO hardware watchdog (explicit modprobe, upgrade-safe)
      DefaultDependencies=no
      After=systemd-modules-load.service
      Before=sysinit.target shutdown.target
      Conflicts=shutdown.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/sbin/modprobe iTCO_wdt
      [Install]
      WantedBy=sysinit.target

- name: Enable the watchdog auto-load service + load it now
  ansible.builtin.systemd:
    name: hw-watchdog-load.service
    enabled: true
    state: started
    daemon_reload: true

- name: Ensure the systemd manager drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"

- name: Configure systemd auto-reboot-on-hang (60s hardware-watchdog timeout)
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/watchdog.conf
    content: |
      [Manager]
      # PID1 stops petting /dev/watchdog for 60s (a real kernel/hardware hang) => iTCO
      # hard-resets the box. Normal operation pets every ~30s, so this only trips on a freeze.
      RuntimeWatchdogSec=60
      RebootWatchdogSec=5min
    mode: "0644"
  register: wd_conf

- name: Re-exec systemd so the watchdog arms without waiting for a reboot
  ansible.builtin.command: systemctl daemon-reexec
  when: wd_conf is changed
  changed_when: true

# ── Longevity: minimize writes to the budget SSD + let the box idle ──────────
# The Kingston SA400 (SATA) holds boot + every container disk + the gondola DB and is the
# only real write sink; the 16 GiB of RAM sits ~2/3 free. Cut discretionary writes.
- name: Lower swappiness + batch writeback — cut discretionary writes to the SSD
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-longevity.conf
    mode: "0644"
    content: |
      # Budget SATA SSD holds boot+containers+DB; RAM is ample. Minimize discretionary writes.
      vm.swappiness = 10
      # Write-batching: wake the writeback thread 3x less often and let dirty pages age longer, so
      # log/misc writes coalesce into fewer, larger flushes. DB durability is unaffected — SQLite
      # WAL fsyncs bypass these. Worst case on hard power-off: ~60s of non-fsync'd data (the iTCO
      # watchdog covers hangs). laptop_mode aligns writeback with other I/O.
      vm.dirty_writeback_centisecs = 1500
      vm.dirty_expire_centisecs = 6000
      vm.laptop_mode = 5
  register: longevity_sysctl

- name: Apply the sysctl drop-in now
  ansible.builtin.command: sysctl --system
  when: longevity_sysctl is changed
  changed_when: true

- name: Disable swap in fstab so there are no swap-out writes to the SSD
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*/dev/pve/swap\s+.*\bswap\b.*)$'
    replace: '# \1  # disabled: avoid SSD swap writes (ample RAM)'
  register: swap_off

- name: Turn swap off now
  ansible.builtin.command: swapoff -a
  when: swap_off is changed
  changed_when: true

- name: Add noatime to the root mount (drop atime write-backs on the wear-limited SSD)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(/dev/pve/root\s+/\s+ext4\s+)errors=remount-ro'
    replace: '\1noatime,errors=remount-ro'
  register: root_noatime

- name: Remount / with noatime now
  ansible.builtin.command: mount -o remount,noatime /
  when: root_noatime is changed
  changed_when: true

# No ZFS pool, no NFS mount, no KSM benefit at 16 GiB — these daemons run for nothing.
# Re-enable rpcbind/nfs-blkmap if backups ever move to NFS; ksmtuned if a VM makes KSM worthwhile.
- name: Mask host daemons with no backing resource
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
    state: stopped
    enabled: false
  loop:
    - zfs-zed.service
    - rpcbind.service
    - rpcbind.socket
    - nfs-blkmap.service
    - ksmtuned.service
  failed_when: false   # any of these may simply not be installed on a lean Debian host

# --- Host firewall: lock the management plane to trusted sources (defense-in-depth) ---
# The host's control plane (SSH :22) is reachable ONLY from Tailscale + the mgmt LAN; everything
# else to those ports is dropped. Guests are deliberately NOT firewalled here — their exposure is
# segmented at the network layer (Omada VLANs). `tailscale0` is always allowed so a bad rule can't
# lock you out. A static nftables ruleset (kernel-loaded once at boot, no resident daemon) owns it;
# under Proxmox this replaced pve-firewall's polling Perl daemon — that's now retired with Proxmox.
- name: nftables package present
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Lock the host control plane to Tailscale + the mgmt LAN (static nftables)
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Enable nftables.service (loads the lockdown ruleset at boot)
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started
