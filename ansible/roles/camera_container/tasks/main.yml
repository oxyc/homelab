# FUTURE (cameras_enabled): the camera stack (Frigate + Caddy [+ Scrypted/cloudflared]) as an
# UNPRIVILEGED Incus container with an Incus `gpu` device for QuickSync. Runs **rootful podman +
# Quadlet** inside the container — the SAME shape as gondola/den (one runtime across the box; the old
# docker-compose was dropped in favour of Quadlet units in docker/quadlet/). NOT deployed on this box
# yet and NOT yet validated on the hardware. Backups are `incus export` (see incus_app/backup.yml).
- name: Check if the camera container exists
  ansible.builtin.command: "incus list {{ docker_ctname }} --format csv -c n"
  register: cam_exists
  changed_when: false
  when: not molecule_test

- name: Create the camera container (nested podman, autostart)
  ansible.builtin.command: >-
    incus launch images:debian/13 {{ docker_ctname }}
    -c security.nesting=true
    -c security.syscalls.intercept.mknod=true
    -c security.syscalls.intercept.setxattr=true
    -c boot.autostart=true
  when:
    - not molecule_test
    - docker_ctname not in cam_exists.stdout
  changed_when: true

- name: Pass the iGPU into the container (unprivileged QuickSync via an Incus gpu device)
  ansible.builtin.command: "incus config device add {{ docker_ctname }} gpu gpu"
  when:
    - not molecule_test
    - docker_ctname not in cam_exists.stdout
  changed_when: true

- name: Mount the NVR disk into the container for recordings
  ansible.builtin.command: "incus config device add {{ docker_ctname }} nvr disk source={{ nvr_mount }} path=/mnt/nvr"
  when:
    - not molecule_test
    - docker_ctname not in cam_exists.stdout
  changed_when: true

# Sync the repo's docker/ dir (Quadlet units + frigate config + caddy build + .env if present) into the
# container, then run the idempotent podman provisioner. Mirrors the app-repo self-provision pattern.
- name: Sync the camera stack sources into the container
  ansible.builtin.command: "incus file push -r -q {{ compose_src }} {{ docker_ctname }}/root/"
  when: not molecule_test
  changed_when: true

- name: Provision podman + Quadlet units inside the container
  ansible.builtin.command: >-
    incus exec {{ docker_ctname }} --
    env COMPOSE_PROFILES="{{ compose_profiles | join(' ') }}"
    bash /root/docker/provision-cameras.sh
  when: not molecule_test
  changed_when: true
