# FUTURE (haos_enabled): Home Assistant OS as an Incus KVM VM. NOT deployed on this box yet.
# Requires the FULL `incus` package (VM support / qemu) on the host — incus_host installs only
# incus-base — so enable this only after `apt-get install incus` on the box. HA itself is
# provisioned by restoring its backup (manual onboarding); this creates the VM shell + disk.
#
# The one consistent gotcha: HAOS will NOT boot under Incus's default secure boot, so the VM sets
# security.secureboot=false.
- name: Download HAOS image
  ansible.builtin.get_url:
    url: "{{ haos_image_url }}"
    dest: "{{ haos_qcow2 }}.xz"
    mode: "0644"

- name: Decompress HAOS image
  ansible.builtin.command: "unxz --keep --force {{ haos_qcow2 }}.xz"
  args:
    creates: "{{ haos_qcow2 }}"
  changed_when: true

- name: Convert the qcow2 to raw (Incus VM disks are raw block images)
  ansible.builtin.command: "qemu-img convert -f qcow2 -O raw {{ haos_qcow2 }} {{ haos_raw }}"
  args:
    creates: "{{ haos_raw }}"
  changed_when: true

- name: Check if the HAOS VM exists
  ansible.builtin.command: "incus list {{ haos_vmname }} --format csv -c n"
  register: haos_exists
  changed_when: false

- name: Create the HAOS VM (UEFI, secureboot off, autostart)
  ansible.builtin.command: >-
    incus init {{ haos_vmname }} --vm --empty
    -c security.secureboot=false
    -c limits.cpu=2 -c limits.memory=2GiB
    -c boot.autostart=true
    -d root,size={{ haos_disk_gb }}GiB
  when: haos_vmname not in haos_exists.stdout
  changed_when: true

