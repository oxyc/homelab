# Create the gondola LXC — an ISOLATED, resource-capped home for the grocery-tracker
# (gondola.uy) app + its self-hosted CI/CD runner. Deliberately separate from the docker
# LXC (CT docker_ctid): it's public-facing and scrapes the internet, so a compromise or a
# runaway nightly Chromium run must not touch the den/Frigate stack.
#
# Unprivileged (no /dev/dri needed — it doesn't transcode). DB lives on the LXC rootfs, which
# is on the PVE SSD (local-lvm) — NOT the NVR NVMe, so its SQLite WAL fsyncs never contend with
# Frigate's 24/7 H.265 writes.
- name: Create gondola LXC
  community.proxmox.proxmox:
    vmid: "{{ gondola_ctid }}"
    node: "{{ ansible_hostname }}"
    hostname: gondola
    ostemplate: "local:vztmpl/debian-12-standard_amd64.tar.zst"
    cores: "{{ gondola_lxc_cores | default(2) }}"       # nightly Chromium burst; 2 is enough, cap keeps it off den
    memory: "{{ gondola_lxc_memory | default(3072) }}"  # app is light; headroom for the scraper run
    swap: 1024
    # DB-dominated (~2.2GB) + images + growth; 20G leaves comfortable room on the SSD.
    disk: "local-lvm:{{ gondola_lxc_disk_gb | default(20) }}"
    unprivileged: true
    features: "nesting=1"                                # docker-in-LXC
    netif: '{"net0":"name=eth0,bridge=vmbr0,ip={{ gondola_lxc_ip }}/24,gw={{ gondola_lxc_gw }}"}'
    # Gateway DNS + public fallback (same lesson as docker_host: a dead resolver silently
    # breaks GHCR pulls + scraping).
    nameserver: "{{ gondola_lxc_gw }} 1.1.1.1"
    pubkey: "{{ lookup('ansible.builtin.url', 'https://github.com/' + admin_github_user + '.keys', split_lines=false) }}"
    onboot: true
    state: present

- name: Ensure gondola LXC running
  community.proxmox.proxmox:
    vmid: "{{ gondola_ctid }}"
    state: started

- name: Bootstrap python + ssh + docker deps inside the LXC (retry — net may lag boot)
  ansible.builtin.command: >-
    pct exec {{ gondola_ctid }} -- sh -c
    'apt-get update -qq && apt-get install -y -qq python3 curl ca-certificates openssh-server sudo jq && systemctl enable --now ssh'
  register: gondola_boot
  until: gondola_boot.rc == 0
  retries: 10
  delay: 6
  changed_when: true

- name: Install Docker in the gondola LXC (idempotent)
  ansible.builtin.command: >-
    pct exec {{ gondola_ctid }} -- sh -c
    'command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh'
  changed_when: true

- name: Register the LXC as a delegation target
  ansible.builtin.add_host:
    name: "{{ gondola_lxc_ip }}"
    ansible_host: "{{ gondola_lxc_ip }}"
    ansible_user: root
  changed_when: false
