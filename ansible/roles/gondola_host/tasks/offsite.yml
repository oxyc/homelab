# Offsite backup of the gondola data -> restic -> R2/B2. The genuinely-missing piece the other
# agent flagged: the app already dumps the DB nightly (`run backup --keep 14`) locally, and the
# LXC gets a daily vzdump, but neither is OFFSITE. This restic timer pushes /opt/gondola/data
# (the live DB + the app's own backup dumps) to object storage, so a whole-box loss is survivable.
# Creds come from /opt/gondola/.env (RESTIC_*/AWS_*). Runs INSIDE the gondola LXC.
- name: Install restic in the gondola LXC
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true

- name: Init the gondola restic repo (idempotent — ignores 'already initialized')
  ansible.builtin.shell: >-
    set -a; . /opt/gondola/.env; set +a;
    restic snapshots >/dev/null 2>&1 || restic init
  changed_when: false
  no_log: true

- name: Install the gondola restic service + timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: gondola-restic.service
      content: |
        [Unit]
        Description=Offsite backup of gondola data to restic/R2
        # Run after the app's nightly pipeline (01:00) so we capture the fresh DB + dumps.
        [Service]
        Type=oneshot
        EnvironmentFile=/opt/gondola/.env
        ExecStart=/usr/bin/restic backup {{ gondola_data_dir }} --tag gondola
        ExecStartPost=/usr/bin/restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
    - name: gondola-restic.timer
      content: |
        [Timer]
        OnCalendar=*-*-* 05:30:00 America/Montevideo
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Enable + start the gondola restic timer
  ansible.builtin.systemd:
    name: gondola-restic.timer
    enabled: true
    state: started
    daemon_reload: true
