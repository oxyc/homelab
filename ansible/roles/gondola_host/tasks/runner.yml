# Self-hosted GitHub Actions runner(s) INSIDE the gondola LXC, labelled `grocery-tracker-deploy`
# to match the repo's existing jobs. This is the cost fix: it moves CI + image-build off paid
# `ubuntu-latest` onto your box, and deploy is already `docker compose pull/up` local to the
# runner. gondola_runner_count runners are registered so CI jobs that used to run in parallel on
# ubuntu-latest still do (a single runner would serialise them).
#
# SECURITY: self-hosted runners are only safe on a PRIVATE repo — untrusted fork PRs must never
# run on your home network. When gondola goes PUBLIC, move CI/PR jobs BACK to `ubuntu-latest`
# (free + unlimited for public repos) and keep ONLY deploy self-hosted, environment-gated.
- name: Create the runner user (in the docker group so deploy jobs can compose up)
  ansible.builtin.user:
    name: runner
    groups: docker
    append: true
    create_home: true
    shell: /bin/bash

- name: Download the Actions runner tarball once (shared by all instances)
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ gondola_runner_version }}/actions-runner-linux-x64-{{ gondola_runner_version }}.tar.gz"
    dest: /opt/actions-runner.tar.gz
    owner: runner
    group: runner
    mode: "0644"

# Registration tokens expire after ~1h but can register multiple runners within that window, so
# mint one and reuse it across the loop. From a PAT (gondola_gh_pat, .env — repo `administration`).
- name: Mint a runner registration token
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ gondola_repo }}/actions/runners/registration-token"
    method: POST
    headers:
      Authorization: "Bearer {{ gondola_gh_pat }}"
      Accept: application/vnd.github+json
    status_code: [201]
  register: reg_token
  changed_when: false
  no_log: true

- name: "Register {{ gondola_runner_count }} runner instance(s)"
  ansible.builtin.include_tasks:
    file: register_runner.yml
    # Explicit so the dynamically-included tasks also run inside the LXC (not just the include task).
    apply:
      delegate_to: "{{ gondola_lxc_ip }}"
  loop: "{{ range(1, gondola_runner_count | int + 1) | list }}"
