# gondola_host: an isolated LXC hosting the grocery-tracker (gondola.uy) app + its self-hosted
# CI/CD runner. Opt-in via `gondola_enabled` so it never runs unless you want it.
#
# Division of labour: THIS role provisions infrastructure (LXC, docker, persistent state + .env,
# the Actions runner, backups). The APP deploys itself via the gondola repo's own deploy.yml,
# which runs on the runner registered here (`docker compose pull/up` local to this LXC) and
# installs the nightly systemd timer (deploy/systemd/grocery-daily.timer, 01:00 Montevideo).
# See docs/gondola.md for the full design + the one-line `runs-on` change that moves CI off paid
# ubuntu-latest onto this runner.
#
# Where each phase runs: create_lxc + backup act on the PVE host (pct / pvesh / proxmox API).
# app + runner + offsite act INSIDE the LXC, so they `delegate_to` its IP (SSH), the same pattern
# restic_backup uses for the docker LXC. create_lxc registers that IP as a delegation target.
- name: Create + prepare the gondola LXC
  ansible.builtin.import_tasks: create_lxc.yml
  when: not molecule_test

- name: Persistent app state + runtime .env
  ansible.builtin.import_tasks: app.yml
  delegate_to: "{{ gondola_lxc_ip }}"
  when: not molecule_test

- name: Install the self-hosted CI/CD runner(s)
  ansible.builtin.import_tasks: runner.yml
  delegate_to: "{{ gondola_lxc_ip }}"
  when: not molecule_test

- name: Back up the gondola LXC (real data, not cattle)
  ansible.builtin.import_tasks: backup.yml
  when: not molecule_test

- name: Offsite backup of gondola data (restic -> R2)
  ansible.builtin.import_tasks: offsite.yml
  delegate_to: "{{ gondola_lxc_ip }}"
  when: not molecule_test
