---
# Opt-in: the gondola LXC is only provisioned when this is true.
gondola_enabled: false

# The private repo the runner attaches to + its images come from.
gondola_repo: oxyc/grocery-tracker

# Pinned Actions runner release (bump deliberately).
gondola_runner_version: "2.330.0"

# LXC sizing (overridable in inventory).
gondola_lxc_cores: 2
gondola_lxc_memory: 3072
gondola_lxc_disk_gb: 20

# Backups
gondola_backup_schedule: "daily 04:30"
gondola_backup_keep: 7
gondola_data_dir: /opt/gondola/data   # restic_backup can push this to B2 for offsite
