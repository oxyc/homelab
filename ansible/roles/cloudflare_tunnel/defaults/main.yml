---
# The homelab Cloudflare tunnel. It deliberately mixes policy at the hostname boundary: Den Web and
# cast are public, device endpoints carry their own authority, add-on APIs are protected by Access,
# and Home Assistant will be protected by Access when it is added. Opt-in: only provisioned when true.
#
# Deliberately NOT the same tunnel as gondola's. They have separate credentials and deploy failure
# domains: gondola's blue/green deploy recreates its cloudflared and must not cut the homelab off.
tunnel_enabled: false

# cloudflared gets its own small, unprivileged Incus container and stable LAN source address. Tailscale
# Serve stays on the host. Keeping those source addresses distinct lets den-edge trust
# CF-Connecting-IP only from this connector without letting a Tailscale client spoof that header.
# Set the real address/gateway in inventory; empty defaults make an accidental deployment fail closed.
tunnel_connector_name: cloudflared
tunnel_connector_ip: ""
tunnel_connector_prefix: 24
tunnel_connector_gateway: ""
tunnel_connector_bridge: "{{ incus_bridge }}"
tunnel_connector_mac: "00:16:3e:cf:00:01"
tunnel_origins: []
tunnel_health_url: ""

# This is a plain pinned binary plus a systemd unit inside the connector; podman/docker would only add
# another network layer. The historical credential filename is retained so the live secret need not be
# renamed or recreated; it is an identifier, not a claim that every hostname is private.
tunnel_version: "2026.3.0"          # pin, matching gondola's cloudflared image tag
tunnel_arch: amd64
tunnel_user: cloudflared
tunnel_config_dir: /etc/cloudflared

# Source files, rendered from the *.example templates and gitignored (see cloudflare/).
# Anchored to playbook_dir on purpose: a bare relative `src` in `copy` resolves against the ROLE's
# files/ directory, not the playbook, so these would have silently pointed at a path that does not
# exist.
#   ingress.yml  -> cloudflared's own config: which hostname reaches which LAN service
#   credentials  -> the tunnel's only credential. A secret: it belongs in your password manager too,
#                   because losing it means re-creating the tunnel and every DNS record that points
#                   at it.
tunnel_ingress_src: "{{ playbook_dir }}/../cloudflare/ingress.yml"
tunnel_credentials_src: "{{ playbook_dir }}/../cloudflare/homelab-private.json"
