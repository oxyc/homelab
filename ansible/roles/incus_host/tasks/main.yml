# incus_host: turn a bare Debian host into the Incus hypervisor for this box. Idempotent.
# (Was `proxmox_host` — the box no longer runs Proxmox: it's plain Debian 13 + Incus. The
#  hostname is still `pve` for historical reasons but there is no PVE control plane.)
- name: Install Incus (container base + client)
  ansible.builtin.apt:
    name: [incus-base, incus-client]
    state: present
    update_cache: true
  # The full `incus` package (VM support) is deliberately NOT installed here — it pulls
  # qemu-system-x86, and nothing here uses a VM: every guest (gondola, den, future Frigate/Scrypted,
  # and Home Assistant — now the ha_container role, not a HAOS VM) is a container. So incus-base is
  # all this box ever needs.

- name: Ensure incus is enabled + running (so boot.autostart guests come up on boot)
  ansible.builtin.systemd:
    name: incus
    enabled: true
    state: started

# --- NVR disk: bulk storage on a SEPARATE physical drive (recordings; export target) ---
- name: Format NVR disk ext4
  community.general.filesystem:
    fstype: ext4
    dev: "{{ nvr_disk_device }}"
    # force: false  # NEVER set force on a disk with data

# Mount by UUID + nofail. This box hard-crashes; without nofail a required local-fs mount that
# fails to re-enumerate after a crash fails local-fs.target -> emergency.target -> a headless box
# stuck at a root console until someone attaches a keyboard. nofail makes the mount a WANT (boot
# continues if the NVMe is missing/renamed); UUID survives an nvme node renumber; the 30s device
# timeout stops a 90s hang. (Pairs with ordering incus.service after this mount — see below — so a
# camera/HA guest never binds an EMPTY /mnt/nvr and records onto the OS SSD.)
- name: Look up the NVR disk UUID
  ansible.builtin.command: "blkid -s UUID -o value {{ nvr_disk_device }}"
  register: nvr_blkid
  changed_when: false

- name: Mount NVR disk (by UUID, nofail — a missing/renamed NVMe must not brick the boot)
  ansible.posix.mount:
    path: "{{ nvr_mount }}"
    src: "UUID={{ nvr_blkid.stdout }}"
    fstype: ext4
    opts: defaults,noatime,nofail,x-systemd.device-timeout=30s
    state: mounted

# Ordering only (NOT RequiresMountsFor): make the NVMe mount be ATTEMPTED before Incus brings guests up,
# so on a slow-enumerating disk a camera/HA guest is less likely to start before /mnt/nvr is ready. It
# deliberately does NOT gate Incus on the mount — gondola/den don't use the NVMe and must still boot if
# it's absent (that's the point of nofail). The deploy-time guard in camera_container/ha_container is
# what refuses to bind an EMPTY /mnt/nvr and record onto the OS SSD.
- name: Ensure the incus.service drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/incus.service.d
    state: directory
    mode: "0755"

- name: Order incus.service after the NVR mount
  ansible.builtin.copy:
    dest: /etc/systemd/system/incus.service.d/after-nvr-mount.conf
    mode: "0644"
    content: |
      [Unit]
      After=mnt-nvr.mount
  register: incus_nvr_dropin

- name: Reload systemd when the incus drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: incus_nvr_dropin.changed

# --- Incus storage + network (first-run init only) ---
# The storage pool reuses the existing LVM thin pool ({{ incus_vg }}/{{ incus_thinpool }}) so
# containers/VMs get thin volumes WITH snapshots (`incus snapshot`; `incus export` for backups —
# the vzdump replacement). The default profile bridges eth0 onto the existing {{ incus_bridge }},
# so guests get LAN IPs directly exactly as the old Proxmox LXCs did; the bridge is never
# reconfigured here (touching it on a headless box is the one real lock-out risk).
- name: Check whether Incus is already initialised
  ansible.builtin.command: incus storage list --format csv
  register: incus_pools
  changed_when: false

- name: Initialise Incus (lvm-thin pool + bridged default profile)
  ansible.builtin.command:
    cmd: incus admin init --preseed
    stdin: |
      storage_pools:
      - name: {{ incus_pool }}
        driver: lvm
        config:
          source: {{ incus_vg }}
          lvm.thinpool_name: {{ incus_thinpool }}
          lvm.vg.force_reuse: "true"
          # Raise the per-volume default from Incus's 10GiB (thin-provisioned, so this reserves
          # address space only) — an app whose data outgrows 10G otherwise fails mid-copy.
          volume.size: 20GiB
      profiles:
      - name: default
        devices:
          root:
            path: /
            pool: {{ incus_pool }}
            type: disk
          eth0:
            name: eth0
            nictype: bridged
            parent: {{ incus_bridge }}
            type: nic
  when: incus_pool not in incus_pools.stdout
  changed_when: true

# A FULL thin pool is the one event that can genuinely CORRUPT guest volumes (writes fail mid-flight).
# lvm2-monitor/dmeventd (already running) will auto-GROW the pool from free VG space once it crosses the
# threshold — event-driven, so it adds NO polling timer / CPU wakeups (kept off deliberately for SSD
# longevity). This is a safety net on top of dmeventd's monitoring; without it a full pool goes read-only.
# VG free is small, so this buys headroom, not infinite growth — pair with watching pool usage. lvmlocal.conf
# is read after (and overrides) lvm.conf.
- name: Enable LVM thin-pool autoextend (dmeventd-driven — no polling timer)
  ansible.builtin.blockinfile:
    path: /etc/lvm/lvmlocal.conf
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE homelab thin-pool autoextend"
    block: |
      activation {
          thin_pool_autoextend_threshold = 80
          thin_pool_autoextend_percent = 20
      }

# --- iGPU (QuickSync) — passed into camera containers via an Incus `gpu` device ---
# Under Incus the render node is handed to an UNPRIVILEGED container with
# `incus config device add <ct> gpu gpu` (cleaner than Proxmox's privileged-LXC +
# hand-rolled cgroup device rules). Here we only assert it's present on the host.
- name: Ensure i915 module is loaded
  community.general.modprobe:
    name: i915
    state: present

- name: Verify the render node exists (QuickSync available for an Incus gpu device)
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: dri
  failed_when: not dri.stat.exists

# --- Networking note (no host VLAN config needed) ---
# Cameras live on a separate VLAN handled by Omada; the host + guests sit on the mgmt
# LAN ({{ incus_bridge }}), and the Omada gateway routes mgmt->camera per ACL. So no
# VLAN-aware bridge or tagging is required on the host — segmentation is entirely on Omada.
