# app_lxc: provision a bare, isolated, docker-capable LXC + host backup. NOTHING app-specific —
# the app's own repo installs docker + its runtime + runner + secrets + app-data backup on top,
# reusing the exact provisioner it uses for its cloud VPS. Opt-in via app_lxc_enabled.
#
# Handoff: this creates an LXC at {{ app_lxc_ip | default('app_lxc_ip') }} reachable by key-only
# SSH as root. The app then runs its own `provision-host.sh` against that IP. See docs/gondola.md.
- name: Create the isolated docker-capable LXC
  ansible.builtin.import_tasks: create_lxc.yml
  when: not molecule_test

- name: Host-level vzdump backup of the LXC
  ansible.builtin.import_tasks: backup.yml
  when: not molecule_test
