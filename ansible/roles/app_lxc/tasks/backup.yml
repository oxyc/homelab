# Host-level point-in-time backup: daily vzdump -> the nvr disk (a separate physical drive, so a
# boot-SSD death doesn't take the snapshots with it). The app's own OFFSITE backup (restic of its
# data) is provisioned by the app's repo, not here.
- name: Read existing PVE backup jobs
  ansible.builtin.command: pvesh get /cluster/backup --output-format json
  register: pve_backup_jobs
  changed_when: false

- name: Create the daily vzdump job for the app LXC when absent
  ansible.builtin.command: >-
    pvesh create /cluster/backup
    --schedule "{{ app_lxc_backup_schedule }}"
    --storage nvr
    --vmid {{ app_lxc_ctid }}
    --mode snapshot
    --compress zstd
    --prune-backups keep-last={{ app_lxc_backup_keep }}
    --notes-template "{% raw %}{{guestname}}{% endraw %} daily (Ansible)"
    --enabled 1
    --comment "daily app LXC ({{ app_lxc_ctid }}) -> nvr"
  when: ('"vmid":"' ~ app_lxc_ctid ~ '"') not in pve_backup_jobs.stdout
  changed_when: true
