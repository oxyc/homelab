# Create an isolated, DOCKER-CAPABLE LXC (nesting + keyctl) with a static IP. Deliberately does
# NOT install docker or anything app-specific — the app's own repo provisions the runtime on top
# (the same provisioner it uses for its VPS), so there's one definition of "an <app> host".
#
# Unprivileged (public-facing/internet-scraping workloads must not have host privileges). Rootfs on
# the PVE SSD (local-lvm) so an app's SQLite WAL fsyncs never contend with the NVR NVMe.
- name: Create app LXC ({{ app_lxc_hostname }})
  community.proxmox.proxmox:
    vmid: "{{ app_lxc_ctid }}"
    node: "{{ ansible_hostname }}"
    hostname: "{{ app_lxc_hostname }}"
    ostemplate: "local:vztmpl/debian-12-standard_amd64.tar.zst"
    cores: "{{ app_lxc_cores }}"
    memory: "{{ app_lxc_memory }}"
    swap: 1024
    disk: "local-lvm:{{ app_lxc_disk_gb }}"
    unprivileged: true
    features: "nesting=1,keyctl=1"        # docker-in-unprivileged-LXC
    netif: '{"net0":"name=eth0,bridge=vmbr0,ip={{ app_lxc_ip }}/24,gw={{ app_lxc_gw }}"}'
    # Gateway DNS + public fallback (a dead resolver silently breaks image pulls / scraping).
    nameserver: "{{ app_lxc_gw }} 1.1.1.1"
    pubkey: "{{ lookup('ansible.builtin.url', 'https://github.com/' + admin_github_user + '.keys', split_lines=false) }}"
    onboot: true
    state: present

- name: Ensure app LXC running
  community.proxmox.proxmox:
    vmid: "{{ app_lxc_ctid }}"
    state: started

# Just enough so the app's provisioner can SSH in (key already installed via `pubkey`).
- name: Bootstrap ssh inside the LXC (retry — net may lag boot)
  ansible.builtin.command: >-
    pct exec {{ app_lxc_ctid }} -- sh -c
    'apt-get update -qq && apt-get install -y -qq openssh-server python3 ca-certificates curl && systemctl enable --now ssh'
  register: app_boot
  until: app_boot.rc == 0
  retries: 10
  delay: 6
  changed_when: true
