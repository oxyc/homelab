# FUTURE (cameras_enabled): the camera stack (Frigate + Scrypted + Caddy) as an UNPRIVILEGED Incus
# container with an Incus `gpu` device for QuickSync. NOT deployed on this box yet and not yet
# validated on Incus. Under Proxmox this was planned as a privileged LXC sharing /dev/dri; under
# Incus it's a nested (podman/docker) container plus `incus config device add cameras gpu gpu` —
# cleaner and safer (unprivileged). Backups are `incus export` (see incus_app/backup.yml), NOT vzdump.
#
# This is a skeleton: it stands up the container shell + gpu + nvr mount. Wiring the compose stack
# (sync ../docker, docker compose up) mirrors the app-repo self-provision pattern and is left as a
# TODO to fill in when the cameras are actually deployed and validated on the hardware.
- name: Check if the camera container exists
  ansible.builtin.command: "incus list {{ docker_ctname }} --format csv -c n"
  register: cam_exists
  changed_when: false
  when: not molecule_test

- name: Create the camera container (nested, autostart)
  ansible.builtin.command: >-
    incus launch images:debian/13 {{ docker_ctname }}
    -c security.nesting=true
    -c security.syscalls.intercept.mknod=true
    -c security.syscalls.intercept.setxattr=true
    -c boot.autostart=true
  when:
    - not molecule_test
    - docker_ctname not in cam_exists.stdout
  changed_when: true

- name: Pass the iGPU into the container (unprivileged QuickSync via an Incus gpu device)
  ansible.builtin.command: "incus config device add {{ docker_ctname }} gpu gpu"
  when:
    - not molecule_test
    - docker_ctname not in cam_exists.stdout
  changed_when: true

- name: Mount the NVR disk into the container for recordings
  ansible.builtin.command: "incus config device add {{ docker_ctname }} nvr disk source={{ nvr_mount }} path=/mnt/nvr"
  when:
    - not molecule_test
    - docker_ctname not in cam_exists.stdout
  changed_when: true

