# incus_app: provision a bare, isolated, PODMAN-capable Incus container + host-level export backup.
# NOTHING app-specific — the app's own repo installs podman + its runtime + secrets + app-data
# backup on top (reusing the exact provisioner it uses elsewhere). Opt-in via app_enabled.
#
# Handoff: this creates a container named {{ app_name }} at {{ app_ip | default('DHCP') }},
# reachable by key-only SSH as root; the app then runs its own provisioner against it (see
# docs/gondola.md). Today the box runs two such containers — gondola (this role's defaults) and
# den — each provisioned by its own repo on top of a bare container like this.
- name: Create the isolated podman-capable Incus container
  ansible.builtin.import_tasks: create_container.yml
  when: not molecule_test

- name: Host-level export backup of the container
  ansible.builtin.import_tasks: backup.yml
  when: not molecule_test
