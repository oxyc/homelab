# Host-level point-in-time backup: a daily `incus export` of the container to the nvr disk (a
# SEPARATE physical drive, so a boot-SSD death doesn't take the exports with it). This is the
# vzdump replacement — `incus export` bundles the instance config + a storage snapshot into one
# tarball that `incus import` restores. The app's own OFFSITE backup (restic of its data) is
# provisioned by the app's repo, not here.
#
# Per-app: skip an app entirely with `backup: false` (adding a container to `incus_apps` should not
# silently start a nightly multi-GB export on its behalf).
- name: Install the incus-export backup script for {{ app.name }}
  ansible.builtin.copy:
    dest: "/usr/local/bin/incus-export-{{ app.name }}"
    mode: "0755"
    content: |
      #!/bin/sh
      set -e
      d={{ nvr_mount }}/backups
      # incus_host mounts {{ nvr_mount }} `nofail` ON PURPOSE — a missing or renamed NVMe must not
      # brick the boot — which makes "booted with it unmounted" an expected state, not a freak one.
      # Without this guard mkdir -p would cheerfully create the directory on the ROOT SSD and write
      # multi-GB exports to the one disk this repo works to keep write churn off, while reporting
      # success and leaving the real backups stale on an unmounted drive.
      mountpoint -q {{ nvr_mount }} || { echo "{{ nvr_mount }} is not mounted — refusing to export to the OS disk" >&2; exit 1; }
      mkdir -p "$d"
      # --instance-only: exclude the container's own snapshots from the export. The `incus snapshot`
      # ring already provides local point-in-time recovery, so bundling the whole snapshot history
      # into every daily tarball just bloats it (observed: gondola export climbing 12->28GB as
      # snapshots accumulated). This keeps each export ~current-instance-sized.
      #
      # Consistency: this exports the LIVE rootfs (optimized-storage dumps the thin volume; on lvm-thin it
      # is near-instant, so the write window is tiny). A torn tarball is still CRASH-CONSISTENT on restore —
      # the guests' stores are SQLite-WAL / atomic-rename, so an import boots and recovers exactly like a
      # power-loss, losing at most the last txn (acceptable). The atomic `incus snapshot` ring is the
      # clean point-in-time recovery path. We deliberately do NOT snapshot+copy+export a throwaway instance
      # for a "perfect" tarball: that would add nightly full-volume write churn on a longevity-sensitive SSD
      # for a loss-only, WAL-recoverable edge case.
      #
      # Written to a .part name and renamed only on success. Writing straight to the final name made
      # a truncated export — disk full, OOM, reboot mid-write — indistinguishable from a good one,
      # and with backup_keep=1 that is fatal rather than untidy: the next run's prune sees the
      # truncated file as the newest backup and deletes the last known-good one. The glob below
      # deliberately does not match .part files, so a failed run can never win the prune.
      f="$d/{{ app.name }}-$(date +%Y%m%d-%H%M%S).tar.zst"
      incus export {{ app.name }} "$f.part" --optimized-storage --compression zstd --instance-only
      mv "$f.part" "$f"
      # keep the last {{ app.backup_keep | default(incus_app_backup_keep) }} exports
      ls -1t "$d"/{{ app.name }}-*.tar.zst | tail -n +{{ (app.backup_keep | default(incus_app_backup_keep)) + 1 }} | xargs -r rm -f
      # A .part left by an earlier failure is dead weight on a disk that may be full; clear stale ones.
      find "$d" -name "{{ app.name }}-*.tar.zst.part" -mtime +1 -delete

- name: Install the backup service + timer for {{ app.name }}
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: "incus-export-{{ app.name }}.service"
      content: |
        [Unit]
        Description=Nightly incus export of {{ app.name }} to {{ nvr_mount }}
        # Persistent=true on the timer fires a missed run right after boot, which can beat incusd
        # to readiness; the export then fails for a reason that has nothing to do with backups.
        After=incus.service
        Wants=incus.service
        # A backup that fails silently is worse than no backup, because backup_keep=1 is justified
        # in the inventory by "restic covers it offsite" — a claim nobody re-checks. This is the one
        # signal that the claim is still true.
        OnFailure=backup-failed@%n.service
        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/incus-export-{{ app.name }}
    - name: "incus-export-{{ app.name }}.timer"
      content: |
        [Timer]
        OnCalendar={{ app.backup_schedule | default(incus_app_backup_schedule) }}
        Persistent=true
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Enable the export timer for {{ app.name }}
  ansible.builtin.systemd:
    name: "incus-export-{{ app.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
