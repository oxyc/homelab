---
# Generic "isolated, podman-capable app container" — the Incus layer only. The APP that runs inside
# (podman, .env, deploy, app-data backup) is owned by that app's own repo, so this role carries ZERO
# app specifics. Today the box hosts gondola.uy (these defaults) and den; each app's repo turns a
# bare container into a running host via its own portable provisioner (see docs/gondola.md).
#
# Opt-in: only provisioned when true.
app_enabled: false

# Legacy molecule guard used by this role's tasks. Defined here (not only in camera_container/defaults)
# so incus_app doesn't rely on another role's defaults leaking play-wide.
molecule_test: false

app_name: gondola
# app_ip / app_gw come from inventory. Leave app_ip empty for a tunnel-only app (DHCP); set it for
# an app whose clients target a fixed LAN IP (e.g. den -> 192.168.x.193).

# Sizing.
app_cores: 2
app_memory: 3072      # MiB
app_disk_gb: 40       # gondola's data+exports need >10G; thin-provisioned so unused space costs nothing

# In-pool CoW snapshots (cheap on lvm-thin) for quick rollback. Crash-consistent only — a
# restored snapshot of a running SQLite app may need WAL recovery; pair with the export backup.
app_snapshot_schedule: "@daily"
app_snapshot_expiry: "7d"

# Host-level backup (incus export -> nvr, the vzdump replacement). App-data offsite backup is the
# app's own concern. Runs from a systemd timer (see backup.yml); keeps the last app_backup_keep.
app_backup_schedule: "*-*-* 04:30:00"
app_backup_keep: 7
