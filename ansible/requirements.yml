collections:
  - name: community.general       # filesystem, modprobe, apt_repository, etc.
  - name: community.docker        # docker_compose_v2 (future camera stack inside its container)
  - name: ansible.posix           # mounts, sysctl, authorized_key
# Incus guests are managed with the `incus` CLI over its local socket (no API collection needed).
# community.proxmox was dropped in the Proxmox->Incus migration.
# install:  ansible-galaxy collection install -r requirements.yml
