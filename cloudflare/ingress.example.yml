# Copy to cloudflare/ingress.yml (gitignored) and fill in. This is cloudflared's own config file for
# the mixed-policy homelab tunnel, deployed to its dedicated Incus connector by the
# `cloudflare_tunnel` role.
#
# It is a file rather than dashboard config because the tunnel is LOCALLY managed (config_src: local).
# The routes churn — den's hostnames will move as the Den Web plan lands — and churn is exactly what
# makes dashboard drift invisible. The trade is that the tunnel authenticates with a credentials JSON
# instead of a TUNNEL_TOKEN; that file is a secret and never lives in this repo.
#
# Keep in step with cloudflare/access.yml: a hostname added here without an Access application there
# is PUBLIC. That is the one failure this pair of files exists to make obvious.

tunnel: <32-hex tunnel id>
credentials-file: /etc/cloudflared/homelab-private.json

# No `protocol:` setting here on purpose: cloudflared's default is quic, which is the better transport —
# faster handshakes, no head-of-line blocking, survives a network change. Recorded so the experiment is
# not repeated: it was once set to http2 while chasing a ~20 s time-to-first-byte ceiling through the
# tunnel that the origin never saw, the ceiling survived the switch unchanged, and it was reverted. A
# protocol change is a plausible-sounding fix for a latency ceiling and was the wrong one. Measure which
# hop is actually slow before changing transport.

# Four connections — cloudflared's default. This once ran at 2 ("enough for a home box"), but 2 left
# Cloudflare's edge holding bursts of uncached requests ~1–20 s before they reached the connector (the
# origin answered in ~5 ms once they did). A measured A/B: at 2, 77/3000 uncached requests took >3 s
# (worst 19.8 s); at 4, 0/4500 did (worst 1.7 s). Four gives the edge more origin paths to spread
# across. Don't drop to 2 to save idle keepalives — it reintroduces the stall.
ha-connections: 4

# Every hostname ends in a catch-all 404, and the FINAL rule is a 404 too. Default-deny per hostname:
# a request reaches a backend only because a rule above says so, never because it fell through.
# Adding a service means adding a rule, which is the point — you cannot expose something by accident.
ingress:
  # ── Den Web (public: no Access app — access.json says why that is safe) ───────────────────────
  - hostname: d.<domain>
    service: http://<den-ip>:8094
  - hostname: d.<domain>
    service: http_status:404

  # Dedicated static smart-TV UI. Its API calls use d-api.<domain>; media never traverses the tunnel.
  - hostname: den-tv.<domain>
    service: http://<den-ip>:8094
  - hostname: den-tv.<domain>
    service: http_status:404

  # Static sender/away player only. Signed media uses the home's public IP directly, never this tunnel.
  - hostname: cast.<domain>
    service: http://<den-ip>:8096
  - hostname: cast.<domain>
    service: http_status:404

  # ── Addon JSON APIs (behind Access) ───────────────────────────────────────────────────────────
  - hostname: d-scout.<domain>
    service: http://<den-ip>:8080
  - hostname: d-scout.<domain>
    service: http_status:404

  - hostname: d-subs.<domain>
    service: http://<den-ip>:8093
  - hostname: d-subs.<domain>
    service: http_status:404

  - hostname: d-atlas.<domain>
    service: http://<den-ip>:8081
  - hostname: d-atlas.<domain>
    service: http_status:404

  # ── den-edge device API (Access BYPASSED — den-edge authorises each request itself) ───────────
  - hostname: d-api.<domain>
    service: http://<den-ip>:8094
  - hostname: d-api.<domain>
    service: http_status:404

  # ── Play tickets (Access BYPASSED) ────────────────────────────────────────────────────────────
  # Only `/p/<ticket>` reaches scout. Anything else on this hostname 404s at the edge, so the
  # bypass cannot be widened by a later scout route appearing. Tickets are unpadded base64url and
  # scout serves them at exactly two path segments, so this matches every ticket and nothing else.
  #
  # This path rule FAILS CLOSED: get it wrong and a ticket is denied. Contrast a path-based Access
  # *bypass*, which fails open — that is why the Access boundary is a hostname and never a prefix.
  - hostname: d-play.<domain>
    path: '^/p/[A-Za-z0-9_-]+$'
    service: http://<den-ip>:8080
  - hostname: d-play.<domain>
    service: http_status:404

  # Required final rule. Anything not named above never reaches the box.
  - service: http_status:404
