# Frigate config. Secrets via {FRIGATE_*} env vars (only FRIGATE_-prefixed work).
# Works WITHOUT HomeKit. The go2rtc restreams below are reused by Scrypted later
# (when you enable the `homekit` compose profile) — nothing here needs to change then.
#
# CX820:  main = 4K H.265 (record, copy/no transcode), sub = H.264 (detect).
# Doorbell (Reolink PoE Video Doorbell, 2K, 4:3): keep its main as H.264 if possible
#          (then no transcode needed for HomeKit later). RTSP kept for 2-way audio.

mqtt:
  enabled: true
  host: "{FRIGATE_MQTT_HOST}"     # HA Mosquitto add-on
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

# Object detection on the Intel UHD 630 iGPU via OpenVINO (uses the shader EUs) — far lower CPU/power
# than CPU detection, and now clean under Incus (unprivileged `gpu` device; the old Proxmox privileged-
# LXC friction that pushed this to CPU is gone). Shares the iGPU with vaapi decode (media engine) and,
# when HomeKit is on, Scrypted's transcode — fine for 2 cameras. Move to a Coral (type: edgetpu) later
# if that contends or when adding cameras. Requires /dev/dri in the container (Quadlet AddDevice).
detectors:
  ov:
    type: openvino
    device: GPU

# Detection model = YOLOv9-s (COCO-80). Much better than the bundled ssdlite mobiledet on small/distant/
# occluded objects, for free, on the SAME OpenVINO iGPU (no Coral). YOLOv9 isn't bundled — the ONNX is
# generated ONCE by provision-cameras.sh (idempotent) into /opt/homelab/frigate/model_cache/yolo.onnx
# (host bind = /config/model_cache). If that build ever fails, switch to the ssdlite fallback below to
# boot, then re-run the provisioner. Export recipe: https://docs.frigate.video/configuration/object_detectors
model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolo.onnx
  labelmap_path: /labelmap/coco-80.txt

# Zero-setup fallback (bundled ssdlite mobiledet; lower accuracy). To revert, comment the block above
# and uncomment this one:
# model:
#   width: 300
#   height: 300
#   input_tensor: nhwc
#   input_pixel_format: bgr
#   path: /openvino-model/ssdlite_mobilenet_v2.xml
#   labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi      # iGPU decode for detect streams (record is copy)

go2rtc:
  streams:
    # --- CX820 (one connection, fanned out) ---
    cx820_main:                   # H.265 4K
      - "http://{FRIGATE_CX820_IP}/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_CAM_USER}&password={FRIGATE_CAM_PASS}"
      # RTSP fallback if FLV is flaky on your firmware:
      # - "rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@{FRIGATE_CX820_IP}:554/h265Preview_01_main#backchannel=0"
    cx820_sub:                    # H.264 low-res
      - "http://{FRIGATE_CX820_IP}/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_CAM_USER}&password={FRIGATE_CAM_PASS}"

    # --- Doorbell (PoE, 2K, 4:3). RTSP so the 2-way backchannel works for HomeKit later. ---
    doorbell_main:                # keep H.264 if the app allows (HomeKit-friendly, no transcode)
      - "rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@{FRIGATE_DOORBELL_IP}:554/h264Preview_01_main"
    doorbell_sub:
      - "rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@{FRIGATE_DOORBELL_IP}:554/h264Preview_01_sub#backchannel=0"

cameras:
  front:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cx820_main      # H.265, copied to disk
          roles: [record]
        - path: rtsp://127.0.0.1:8554/cx820_sub       # H.264, cheap detect
          roles: [detect]
    detect:
      width: 640
      height: 480
      fps: 3                       # 5->3: motion+detect work scales with fps (~40% less CPU) — plenty for a home NVR
    objects:
      # Wide net to start (detecting is cheap + motion-gated; filter with zones later). Trim after a
      # week whatever never fires (likely bus/horse). Add cow/sheep (countryside view) or boat (water
      # sightline) if relevant. bird = expect volume from the trees → route to detections, not alerts.
      track: [person, bicycle, car, motorcycle, bus, truck, bird, cat, dog, horse]
    # --- Zones + alert routing (draw coords in the 0.17 UI, paste back; keep commented until then) ---
    # Property vocabulary = physical places, camera-agnostic (same names on every camera that sees them):
    #   platform  = the raised deck by the house (walkways + patio). Inner sanctum.
    #   yard      = the ~20m walk-through ground between deck and fence. Transit; we never dwell here.
    #   gate_car  = the 3m vehicle gate (deliveries/vehicles stop here).
    #   gate_ped  = the 1.2m pedestrian gate (visitors).
    # Alert rule: DECK = face-based (unknown person -> alert immediately; we legitimately loiter on the
    # patio, so NO loiter timer here). YARD/GATES = loiter-based (brief crossing is normal; lingering ->
    # alert). Known faces are suppressed in the HA notification layer, not here.
    # zones:
    #   platform:
    #     coordinates: 0,0,0.4,0,0.4,0.3,0,0.3      # TODO draw in UI
    #     loitering_time: 0
    #   yard:
    #     coordinates: ...                          # TODO
    #     loitering_time: 30                        # ignore transit; count only if they linger 30s
    #   gate_car:
    #     coordinates: ...                          # TODO
    #     loitering_time: 0
    #   gate_ped:
    #     coordinates: ...                          # TODO
    #     loitering_time: 0
    # review:
    #   alerts:
    #     required_zones: [platform, gate_car, gate_ped]
    #   detections:
    #     required_zones: [yard]
    #
    # Motion masks (cut noise + CPU): mask BEYOND the fence (road, across-street), the tree canopy (wind),
    # and the burnt-in timestamp. NOTE: a motion mask stops detection, NOT recording — to actually blank
    # the neighbor out of the video, use the Reolink CAMERA-side privacy mask (see docs).
    # motion:
    #   mask:
    #     - 0,0,0.15,0,0.15,0.08,0,0.08            # example: timestamp corner

  doorbell:
    ffmpeg:
      inputs:
        - path: "rtsp://127.0.0.1:8554/doorbell_main?backchannel=0"
          roles: [record]
        - path: rtsp://127.0.0.1:8554/doorbell_sub
          roles: [detect]
    detect:
      width: 640                  # 4:3 doorbell
      height: 480
      fps: 3                       # see note above
    objects:
      track: [person]           # `package` is NOT a COCO class — stock YOLOv9 won't detect it. Add it
                                # back once the custom/Frigate+-style model is in (see docs reproduce plan).
    # --- Doorbell: mask everything past ~4m (the drop-off, 1m path, jasmin fence, neighbor lot) so the
    # only live area is the door approach. Any person left in-frame = at the door. Name that remaining
    # area `platform` (same deck as the corner cam) so "someone's at the house" is one cross-camera fact.
    # For real privacy over the neighbor's lot, use the Reolink camera-side privacy mask, not just this.
    # motion:
    #   mask:
    #     - ...                                     # neighbor lot + everything past the platform edge
    # zones:
    #   platform:
    #     coordinates: ...                          # the 4m door approach (optional — mask alone works)
    #     loitering_time: 0
    # review:
    #   alerts:
    #     required_zones: [platform]

record:
  enabled: true
  retain:
    days: 7
    mode: motion
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30

snapshots:
  enabled: true
  retain:
    default: 14

# --- Enrichments: free, built into Frigate 0.16+, run locally — no Frigate+, no Coral ---
face_recognition:
  enabled: true
  model_size: small        # FaceNet on CPU (i5-8500T has AVX2). Bump to `large` (ArcFace on the iGPU)
                           # for better accuracy once the stack is stable. Add faces in the Frigate UI →
                           # it labels a detected `person` as e.g. "Andrea".

lpr:
  enabled: true            # built-in YOLOv9 plate detector + PaddleOCR. Do NOT add `license_plate` to
                           # tracked objects (only Frigate+/native-plate models want that).

birdseye:
  enabled: true
  mode: objects

version: 0.16-0
