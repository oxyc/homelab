# Runs inside one privileged Docker LXC with /dev/dri bound in (shared QuickSync).
# Secrets/IPs come from ./.env (gitignored).
#
# Default `docker compose up`  => frigate + caddy (+ HA lives in its own VM).
# HomeKit later                => `docker compose --profile homekit up -d`   (adds scrypted)
# HA via Cloudflare Zero Trust => `docker compose --profile tunnel up -d`    (adds cloudflared)
# Den trailers (LAN-only)      => `docker compose --profile trailers up -d`  (adds trailer-service)
# Den Scout (streams, https)   => `docker compose --profile scout up -d`     (adds den-scout)
# Den Atlas (dataset, LAN)     => `docker compose --profile atlas up -d`     (adds den-atlas)
name: homelab

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:${FRIGATE_VERSION:-stable}
    container_name: frigate
    restart: unless-stopped
    shm_size: "256mb"          # 2 cameras; bump if you add more
    devices:
      - /dev/dri:/dev/dri      # iGPU: vaapi decode for detect (record is copy)
    env_file: .env
    volumes:
      - ./frigate/config.yml:/config/config.yml:ro
      - frigate_data:/config
      - type: bind
        source: /mnt/nvr       # 2TB NVMe (ext4) bind-mounted from the LXC host
        target: /media/frigate
    ports:
      - "5000:5000"            # behind Caddy
      - "8554:8554"            # go2rtc RTSP restream (Scrypted/HA pull from here)
      - "8555:8555/tcp"
      - "8555:8555/udp"

  caddy:
    # Custom build = Caddy + cloudflare DNS module (for wildcard DNS-01 certs).
    build:
      context: ./caddy
      args:
        CADDY_VERSION: "${CADDY_VERSION:-2}"
    image: homelab-caddy:${CADDY_VERSION:-2}
    container_name: caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- Cloudflare Tunnel: browser/family access to HA via Zero Trust (off by default) ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]       # docker compose --profile tunnel up -d
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    # No ports: outbound-only tunnel. Ingress + Access policy live in the CF dashboard.

  # --- HomeKit / HKSV: DISABLED until you opt in (see profile note at top) ---
  scrypted:
    image: ghcr.io/koush/scrypted:${SCRYPTED_VERSION:-latest}
    container_name: scrypted
    restart: unless-stopped
    profiles: ["homekit"]      # not started by a plain `docker compose up`
    network_mode: host         # HomeKit/HKSV need host mDNS on the LAN
    devices:
      - /dev/dri:/dev/dri      # iGPU: H.265 -> H.264 transcode for HomeKit/HKSV
    volumes:
      - scrypted_data:/server/volume   # HomeKit pairings live here (not backed up by choice)

  # --- Den trailers: addon (imdb->ytId) + yt-dlp/ffmpeg proxy (ytId->MP4) in one container ---
  # LAN-only by design: fronted by Caddy at https://trailers.${CADDY_LOCAL_DOMAIN}, never
  # published or tunneled — the Apple TV must be on the same LAN. Needs internet (TMDB + yt-dlp
  # reach the web), which the mgmt LAN has. We pass ONLY the two keys it needs (not env_file),
  # so the rest of .env doesn't leak into an internet-facing container. Caddy forwards Host +
  # X-Forwarded-Proto, so the addon builds correct https://trailers.<domain>/play/... URLs.
  # Image built + pushed from github.com/oxyc/den-trailer-service (GHCR).
  # Add https://trailers.<domain>/manifest.json to Den. Opt in: `--profile trailers up -d`.
  trailer-service:
    image: ghcr.io/oxyc/den-trailer-service:${TRAILER_SERVICE_VERSION:-latest}
    container_name: trailer-service
    restart: unless-stopped
    profiles: ["trailers"]
    environment:
      TMDB_KEY: ${TMDB_KEY}              # required for the addon (/meta lookups)
      KINOCHECK_KEY: ${KINOCHECK_KEY:-}  # optional trailer-discovery fallback
    volumes:
      - trailer_cache:/cache
    # No published port: Caddy reverse-proxies it over the LAN (https, real cert → no ATS
    # exception needed in Den). Add `ports: ["8092:8092"]` only if you want direct
    # http://<lxc-ip>:8092 access instead — then Den needs NSAllowsLocalNetworking.

  # --- Den Scout: self-hosted Stremio stream addon (scrape → rank → cached-first debrid resolve) ---
  # LAN-only for now (like the trailer service): Den reaches it at http://<lxc-ip>:8080 — Den's
  # NSAllowsLocalNetworking exempts LAN hosts from the https-only addon check, so no cert is needed.
  # Egress is the box's single fixed WAN IP, which is what Real-Debrid pins tokens to. Holds NO
  # secrets: the debrid token is per-install, encoded in the addon URL the user builds in Den →
  # Settings → Streaming source (or on scout's /configure page), never in this container's env.
  # The Caddy `scout.<domain>` route below is the eventual public-https path; harmless meanwhile.
  # Image built + pushed from github.com/oxyc/den-scout (GHCR). Opt in: `--profile scout up -d`.
  den-scout:
    image: ghcr.io/oxyc/den-scout:${DEN_SCOUT_VERSION:-latest}
    container_name: den-scout
    restart: unless-stopped
    profiles: ["scout"]
    environment:
      PORT: "8080"
      SCOUT_SCRAPE_TIMEOUT_MS: "${SCOUT_SCRAPE_TIMEOUT_MS:-8000}"
      SCOUT_LIST_TTL_SECONDS: "${SCOUT_LIST_TTL_SECONDS:-300}"
      SCOUT_MEDIAFUSION_URL: "${SCOUT_MEDIAFUSION_URL:-}"   # base incl. its encrypted-config segment
    ports:
      - "8080:8080"                       # LAN: add http://<lxc-ip>:8080/<config>/manifest.json in Den
    read_only: true                       # only needs outbound https + its listen socket
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # log rotation
    # In-container MemoryCache (TTL) is the cache backend — right for one replica; add a redis
    # service + back the Cache seam with it only if you ever scale past one container.

  # --- Den Atlas: dataset addon — serves the derived feature store (labels + int8 vectors) that
  # Den downloads + refreshes for on-device similar-titles / categories / billboard. Holds NO
  # secrets, no /configure. LAN-only like the others; Den reaches it at http://<lxc-ip>:8081.
  # IMPORTANT: the PUBLISHED image is SERVER-ONLY — the ~33MB dataset blobs are gitignored, so you
  # MOUNT them at /app/data. Produce/refresh them with a local `npm run import` in the den-atlas
  # repo, then copy its ./data/* into ./atlas-data here (gitignored) BEFORE first start, else it
  # exits with ENOENT dataset.meta.json. Image: github.com/oxyc/den-atlas (GHCR).
  # Opt in: `--profile atlas up -d`. (Port 8081 on the host — 8080 is scout.)
  den-atlas:
    image: ghcr.io/oxyc/den-atlas:${DEN_ATLAS_VERSION:-latest}
    container_name: den-atlas
    restart: unless-stopped
    profiles: ["atlas"]
    environment:
      PORT: "8080"
    volumes:
      - ./atlas-data:/app/data:ro     # the dataset blobs (populate before starting)
    ports:
      - "8081:8080"                   # LAN: add http://<lxc-ip>:8081/manifest.json in Den
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  frigate_data:
  scrypted_data:
  caddy_data:
  caddy_config:
  trailer_cache:
